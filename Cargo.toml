[workspace]
resolver = "2"
members = ["crates/sk-math", "crates/sk-paint", "crates/sk-ui", "crates/sk-platform", "crates/sk-render", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
